{% extends 'base.html' %}

{% block title %}Sign In - Family Care{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full glass-card p-8 rounded-2xl shadow-xl space-y-6">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl gradient-accent mx-auto flex items-center justify-center text-white shadow-lg mb-3">
                <i data-lucide="heart-pulse" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Sign In to Family Care</h2>
            <p class="text-xs text-slate-500 mt-1">Manage your family health records, medicines &amp; appointments</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                <input type="text" name="username" required class="form-input" placeholder="Enter username">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required class="form-input" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white gradient-accent shadow-md hover:opacity-95 transition">
                Sign In
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-200 text-xs text-slate-600">
            Don't have an account? 
            <a href="{% url 'signup' %}" class="font-bold text-teal-600 hover:underline">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
